name: Build B
on:
  workflow_call:
    inputs:
      buildError:
        required: true
        type: string
    secrets:
      personal_access_token:
        required: false
      GOOGLE_AI_API_KEY:
        required: true
jobs:
  process-error:
    runs-on: ubuntu-latest
    steps:
      - name: Print received error
        run: |
          echo "===== RECEIVED BUILD ERROR ====="
          echo "${{ inputs.buildError }}"
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-genai
      - name: Send error to Gemini
        id: gemini
        env:
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          BUILD_ERROR: ${{ inputs.buildError }}
        run: |
          python - <<'EOF'
          import os, json, re
          from google import genai
          client = genai.Client(api_key=os.environ["GOOGLE_AI_API_KEY"])
          build_error = os.environ["BUILD_ERROR"]
          prompt = f"""
          You are an autonomous DevOps AI.
          Return ONLY JSON:
          
          {{
            "files_to_modify": [
              {{
                "file_path": ".github/workflows/dotnet.yaml",
                "content": "<FULL UPDATED FILE CONTENT>"
              }}
            ],
            "commit_message": "fix: <short message>"
          }}
          
          Rules:
          - Output ONLY JSON
          - No explanation
          - Ensure valid YAML
          
          Error:
          {build_error}
          """
          
              response = client.models.generate_content(
                  model="models/gemini-2.5-flash",
                  contents=prompt
              )
          
              text = response.text
          
              # Extract JSON safely
              match = re.search(r'\{.*\}', text, re.DOTALL)
              if not match:
                  raise Exception("No JSON found")
          
              data = json.loads(match.group(0))
          
              with open("ai_fix.json", "w") as f:
                  json.dump(data, f, indent=2)
          
              print("✅ AI response saved")
              EOF
      
      
      - name: Apply AI Fix
        run: |
          python - <<'EOF'
          import json, os
          with open("ai_fix.json") as f:
              data = json.load(f)
          for file in data["files_to_modify"]:
              path = file["file_path"]
              content = file["content"]

              print(f"Updating {path}")      
              os.makedirs(os.path.dirname(path), exist_ok=True)

              with open(path, "w") as f:
                  f.write(content)      
          print("✅ Fix applied")
          EOF




 
