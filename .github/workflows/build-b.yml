name: Build B
on:
  workflow_call:
    inputs:
      buildError:
        required: true
        type: string
    secrets:
      personal_access_token:
        required: false
      GOOGLE_AI_API_KEY:
        required: true
jobs:
  process-error:
    runs-on: ubuntu-latest
    steps:
      - name: Print received error
        run: |
          echo "===== RECEIVED BUILD ERROR ====="
          echo "${{ inputs.buildError }}"
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-genai
      - name: Send error to Gemini
        env:
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          BUILD_ERROR: ${{ inputs.buildError }}
        run: |
          python - <<'EOF'
          import os
          from google import genai
          from google.genai import types

          client = genai.Client(api_key=os.environ["GOOGLE_AI_API_KEY"])

          build_error = os.environ["BUILD_ERROR"]

          prompt = f"""
          You are an autonomous DevOps AI agent.
          
          Your job is to FIX the CI/CD pipeline.
          
          Return ONLY valid JSON. No explanation.
          
          Format:
          {{
            "files_to_modify": [
              {{
                "file_path": ".github/workflows/dotnet.yaml",
                "change_type": "replace",
                "content": "<FULL UPDATED FILE CONTENT>"
              }}
            ],
            "commit_message": "fix: <short message>"
          }}
          
          Rules:
          - Modify ONLY necessary files
          - Keep changes minimal
          - Output complete file content (not diff)
          - Ensure YAML is valid
          
          Error লগ:
          {build_error}
          """

          print("Sending error to Gemini for analysis...")

          response = client.models.generate_content(
              model="models/gemini-2.5-flash",
              contents=prompt,
              config=types.GenerateContentConfig(
                  temperature=0.3,
                  max_output_tokens=15000,
              )
          )

          print("\n===== AI AGENT RESPONSE =====")
          print(response.text)
          EOF
