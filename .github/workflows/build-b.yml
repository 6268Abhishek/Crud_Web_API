name: Build B (AI Fix Pipeline)

on:
  workflow_call:
    inputs:
      buildError:
        required: true
        type: string
    secrets:
      GOOGLE_AI_API_KEY:
        required: true

jobs:
  process-error:
    runs-on: ubuntu-latest

    steps:
      # ✅ 1. Checkout Repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ 2. Setup Git Auth (for push)
      - name: Setup Git Auth
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      # ✅ 3. Read Current Workflow
      - name: Read Current Workflow
        id: read_yaml
        run: |
          echo "workflow<<EOF" >> $GITHUB_OUTPUT
          cat .github/workflows/dotnet.yml >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ✅ 4. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ✅ 5. Install AI SDK
      - name: Install Dependencies
        run: pip install google-genai

      # ✅ 6. Send Workflow + Error to AI
      - name: Generate Fix using AI
        id: gemini
        run: |
          python - <<'EOF'
          import os, json, re
          from google import genai
          
          client = genai.Client(api_key=os.environ["GOOGLE_AI_API_KEY"])
          
          error = os.environ["BUILD_ERROR"]
          workflow = os.environ["CURRENT_WORKFLOW"]
          
          prompt = f"""
          You are a senior DevOps AI.
          
          Return ONLY JSON:
          {{
            "fixed_workflow": "<FULL FIXED YAML>",
            "commit_message": "fix: <short message>"
          }}
          
          CURRENT WORKFLOW:
          {workflow}
          
          ERROR:
          {error}
          """
          
          response = client.models.generate_content(
              model="models/gemini-2.5-flash",
              contents=prompt
          )
          
          text = response.text
          
          match = re.search(r'\{.*\}', text, re.DOTALL)
          if not match:
              raise Exception("No JSON found")
          
          data = json.loads(match.group(0))
          
          with open("ai_fix.json", "w") as f:
              json.dump(data, f, indent=2)
          
          print("✅ AI response saved")
          EOF
      - name: Apply AI Fix
        run: |
          python - <<'EOF'
          import json
          
          with open("ai_fix.json") as f:
              data = json.load(f)
          
          workflow = data["fixed_workflow"]
          
          with open(".github/workflows/dotnet.yml", "w") as f:
              f.write(workflow)
          
          print("✅ Workflow updated")
          EOF
      # ✅ 8. Create Branch
      - name: Create Branch
        run: git checkout -b ai-fix-${{ github.run_id }}

      # ✅ 9. Commit Changes
      - name: Commit Changes
        run: |
          git config user.name "ai-bot"
          git config user.email "ai@bot.com"
          git add .
          git commit -m "AI Fix: CI failure"

      # ✅ 10. Push Branch
      - name: Push Branch
        run: git push origin ai-fix-${{ github.run_id }}

      # ✅ 11. Trigger Workflow on New Branch
      - name: Trigger CI
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/dotnet.yaml/dispatches \
            -d "{\"ref\":\"ai-fix-${{ github.run_id }}\"}"

      # ✅ 12. Wait for CI
      - name: Wait for CI
        run: sleep 60

      # ✅ 13. Check CI Status
      - name: Check CI Status
        id: check
        run: |
          STATUS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs \
            | jq -r '.workflow_runs[0].conclusion')

          echo "status=$STATUS" >> $GITHUB_OUTPUT

      # ✅ 14. Create PR if Success
      - name: Create Pull Request
        if: steps.check.outputs.status == 'success'
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls \
            -d '{
              "title": "AI Fix for CI Failure",
              "head": "ai-fix-${{ github.run_id }}",
              "base": "master",
              "body": "Auto-generated fix after successful CI validation"
            }'
