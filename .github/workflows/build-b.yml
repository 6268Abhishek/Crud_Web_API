name: Build B
on:
  workflow_call:
    inputs:
      buildError:
        required: true
        type: string
    secrets:
      personal_access_token:
        required: false
      GCP_PROJECT_ID:
        required: true
      GCP_LOCATION:
        required: true
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT:
        required: true

jobs:
  process-error:
    runs-on: ubuntu-latest

    # ✅ Required for OIDC token exchange
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Print received error
        run: |
          echo "===== RECEIVED BUILD ERROR ====="
          echo "${{ inputs.buildError }}"

      - name: Authenticate to GCP via Workload Identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-cloud-aiplatform

      - name: Send error to Vertex AI (Gemini)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
          BUILD_ERROR: ${{ inputs.buildError }}
        run: |
          python - <<'EOF'
          import os
          import vertexai
          from vertexai.generative_models import GenerativeModel

          # No manual auth needed — google-github-actions/auth step
          # already set up Application Default Credentials (ADC)

          vertexai.init(
              project=os.environ["GCP_PROJECT_ID"],
              location=os.environ["GCP_LOCATION"],
          )

          model = GenerativeModel("gemini-1.5-flash")

          build_error = os.environ["BUILD_ERROR"]

          prompt = f"""You are a senior DevOps and software engineer assistant.
          Analyze the following CI/CD build error and provide:
          1. Root cause analysis
          2. Step-by-step fix
          3. How to prevent it in future

          Build Error:
          {build_error}
          """

          print("Sending error to Gemini for analysis...")
          response = model.generate_content(prompt)

          print("\n===== AI AGENT RESPONSE =====")
          print(response.text)
          EOF
