name: Build B
on:
  workflow_call:
    inputs:
      buildError:
        required: true
        type: string
    secrets:
      personal_access_token:
        required: false
      GCP_PROJECT_ID:
        required: true
      GCP_LOCATION:
        required: true
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT:
        required: true

jobs:
  process-error:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Print received error
        run: |
          echo "===== RECEIVED BUILD ERROR ====="
          echo "${{ inputs.buildError }}"

      - name: Authenticate to GCP via Workload Identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai google-auth

      - name: Send error to Vertex AI (Gemini)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
          BUILD_ERROR: ${{ inputs.buildError }}
        run: |
          python - <<'EOF'
          import os
          import google.auth
          import google.auth.transport.requests
          from google import genai
          from google.genai import types

          # Refresh ADC credentials set up by google-github-actions/auth
          credentials, project = google.auth.default(
              scopes=["https://www.googleapis.com/auth/cloud-platform"]
          )
          credentials.refresh(google.auth.transport.requests.Request())

          client = genai.Client(
              vertexai=True,
              project=os.environ["GCP_PROJECT_ID"],
              location=os.environ["GCP_LOCATION"],
          )

          build_error = os.environ["BUILD_ERROR"]

          prompt = f"""You are a senior DevOps and software engineer assistant.
          Analyze the following CI/CD build error and provide:
          1. Root cause analysis
          2. Step-by-step fix
          3. How to prevent it in future

          Build Error:
          {build_error}
          """

          print("Sending error to Gemini for analysis...")

          response = client.models.generate_content(
              model="gemini-2.0-flash",
              contents=prompt,
              config=types.GenerateContentConfig(
                  temperature=0.3,
                  max_output_tokens=1500,
              )
          )

          print("\n===== AI AGENT RESPONSE =====")
          print(response.text)
          EOF
