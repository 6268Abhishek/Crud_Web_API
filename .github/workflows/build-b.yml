name: Build B
on:
  workflow_call:
    inputs:
      buildError:
        required: true
        type: string
    secrets:
      personal_access_token:
        required: false
      GOOGLE_AI_API_KEY:
        required: true
jobs:
  process-error:
    runs-on: ubuntu-latest
    steps:
      - name: Print received error
        run: |
          echo "===== RECEIVED BUILD ERROR ====="
          echo "${{ inputs.buildError }}"
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-genai

      - name: List available Gemini models
        env:
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
        run: |
          python - <<'EOF'
          import os
          from google import genai

          client = genai.Client(api_key=os.environ["GOOGLE_AI_API_KEY"])

          print("===== AVAILABLE GEMINI MODELS =====")
          for model in client.models.list():
              if "gemini" in model.name.lower():
                  print(model.name)
          EOF

      - name: Send error to Gemini
        env:
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          BUILD_ERROR: ${{ inputs.buildError }}
        run: |
          python - <<'EOF'
          import os
          from google import genai
          from google.genai import types

          client = genai.Client(api_key=os.environ["GOOGLE_AI_API_KEY"])

          build_error = os.environ["BUILD_ERROR"]

          prompt = f"""You are a senior DevOps and software engineer assistant.
          Analyze the following CI/CD build error and provide:
          1. Root cause analysis
          2. Step-by-step fix
          3. How to prevent it in future

          Build Error:
          {build_error}
          """

          print("Sending error to Gemini for analysis...")

          # Available models list se sahi model pick karega
          available_models = [m.name for m in client.models.list() if "gemini" in m.name.lower()]
          print(f"Trying models: {available_models}")

          # Priority order mein try karega
          preferred = [
              "models/gemini-2.0-flash",
              "models/gemini-2.0-flash-lite",
              "models/gemini-1.5-flash",
              "models/gemini-1.5-pro",
          ]

          model_to_use = None
          for p in preferred:
              if p in available_models:
                  model_to_use = p
                  break

          if not model_to_use:
              model_to_use = available_models[0] if available_models else None

          if not model_to_use:
              print("No Gemini models available!")
              exit(1)

          print(f"Using model: {model_to_use}")

          response = client.models.generate_content(
              model=model_to_use,
              contents=prompt,
              config=types.GenerateContentConfig(
                  temperature=0.3,
                  max_output_tokens=1500,
              )
          )

          print("\n===== AI AGENT RESPONSE =====")
          print(response.text)
          EOF
