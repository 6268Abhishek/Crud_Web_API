name: Build A

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Build
        id: buildstep
        run: |
          echo "Running build..."
          echo "invalidcommand123" > error.txt
          invalidcommand123 || true
          exit 1
        continue-on-error: true

      - name: Send Error to Build B
        if: steps.buildstep.outcome == 'failure'
        run: |
          ERROR_MSG=$(cat error.txt | jq -Rs .)
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d "{\"event_type\":\"build_failed\",\"client_payload\":{\"error\":$ERROR_MSG,\"run_id\":\"${{ github.run_id }}\"}}"
